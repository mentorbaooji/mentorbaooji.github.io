    <rect x="38" y="16" width="28" height="10" fill="#1C1B19"/>
    <rect x="38" y="45" width="24" height="10" fill="#1C1B19"/>
    <rect x="38" y="74" width="28" height="10" fill="#1C1B19"/>
    <rect x="56" y="26" width="10" height="19" fill="#1C1B19"/>
    <rect x="56" y="55" width="10" height="19" fill="#1C1B19"/>
  </g>
</svg>
