<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="monogramBadgeTitle">
  <title id="monogramBadgeTitle">Mentor Baooji</title>

  <!-- Parchment field + quiet hairline ring -->
  <circle cx="60" cy="60" r="58" fill="#F6F3EE"/>
  <circle cx="60" cy="60" r="58" fill="none" stroke="#DDD6C8" stroke-width="1.5"/>

  <!-- Monogram, centered with 10px inset from the base 100x100 mark -->
